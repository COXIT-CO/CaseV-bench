name: CI — annotation tool

on:
  pull_request:
    branches: [main]
    paths:
      - "annotation_tool/**"
      # The tests check that the public ground truth loads in the tool and fits its drawing.
      - "dataset/public/**"
      - ".github/workflows/ci-annotation-tool.yml"
  push:
    branches: [main]
    paths:
      - "annotation_tool/**"
      - "dataset/public/**"
      - ".github/workflows/ci-annotation-tool.yml"

# A newer push to the same ref cancels the in-flight run. `github.workflow` is part of the key,
# so this never cancels another workflow's run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job name is the branch-protection status context — keep it stable.
  annotation-tool:
    name: annotation-tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: annotation_tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: annotation_tool/requirements.txt

      # The UI tests use Node's built-in test runner, so there is nothing to npm install.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install -r requirements.txt pytest

      # Server API, export on rotated pages, `make stop`, and the public dataset.
      - name: pytest
        run: pytest -q

      # Saving and loading the project JSON, ids, undo history.
      - name: node --test
        run: node --test 'tests/*.test.mjs'
