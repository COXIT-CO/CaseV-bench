# CI gate for pull requests (ADR-0017). Railway owns deploy (native git-deploy on `main`);
# this workflow's only job is to stop broken code from reaching that auto-deploying branch.
# Two independent jobs run in parallel — backend lint+tests and frontend build+tests — each
# step isolated so a failure names itself. No `docker build`, no deploy: Railway's build +
# keep-last-good is the safety net, and `npm run build` here already catches the common
# "builds locally, breaks in container" causes pre-merge.
#
# Scoped to demo-app/ only (paths filter below): this workflow lives at repo root because
# GitHub Actions only reads workflows from .github/workflows/, but it has nothing to do with
# main's own project (results_store) — PRs that don't touch demo-app/ never trigger it.
name: Demo App CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'demo-app/**'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo-app
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install "poetry>=2.1,<3.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: demo-app/poetry.lock
      - name: Install dependencies
        run: poetry install --with dev --no-root
      - name: black --check
        run: poetry run black --check src tests
      - name: isort --check
        run: poetry run isort --check-only src tests
      - name: pytest
        run: poetry run pytest
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo-app/src/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo-app/src/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
