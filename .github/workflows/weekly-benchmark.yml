# Drift check: fixed prompt, dataset and settings, so only the model can change between runs.
# Runs go to the `service` schema; the README dashboard is regenerated from that history and
# proposed as a PR. Optionally posts results to Slack if SLACK_WEBHOOK_URL is configured as
# a repo secret.
name: Weekly benchmark

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Model list comes from core/config.py.
  roster:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.roster.outputs.models }}
    defaults:
      run:
        working-directory: src/runner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - id: roster
        env:
          CASEV_MODEL_ROSTER: ${{ vars.CASEV_MODEL_ROSTER }}
        run: |
          models=$(uv run python3 -c "
          import json

          from core.config import MODEL_ROSTER

          print(json.dumps(sorted(MODEL_ROSTER)))
          ")
          echo "models=$models" >> "$GITHUB_OUTPUT"

  # One job per model. fail-fast off so one provider outage doesn't cancel the others.
  benchmark:
    needs: roster
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.roster.outputs.models) }}
    defaults:
      run:
        working-directory: src/runner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group store  # store group: psycopg for the publish step

      # Explicit run id so every later step can address the same run directory.
      - id: ctx
        run: |
          echo "slug=${MODEL//\//-}" >> "$GITHUB_OUTPUT"
          echo "run_id=weekly-${MODEL//\//-}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
        env:
          MODEL: ${{ matrix.model }}

      # Same CLI as local/Docker. Spend is capped on the OpenRouter key, not in the app.
      - name: Run against the committed dataset
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CASEV_MODEL_ROSTER: ${{ vars.CASEV_MODEL_ROSTER }}
          MODEL: ${{ matrix.model }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
          DATASET_DIR: ${{ github.workspace }}/dataset
        run: |
          uv run casev run \
            --model "$MODEL" \
            --dataset-dir "$DATASET_DIR" \
            --run-id "$RUN_ID" \
            --out-dir results

      # A partial run is fine locally (resumable) but must fail loudly here.
      - name: Verify the run completed
        env:
          MODEL: ${{ matrix.model }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
        run: |
          run_json="results/$RUN_ID/run.json"
          run_status=$(jq -r '.status' "$run_json")
          scored=$(jq -r '.pages_scored' "$run_json")
          total=$(jq -r '.pages_total' "$run_json")
          echo "status=$run_status pages_scored=$scored pages_total=$total"
          if [ "$run_status" != "complete" ]; then
            echo "::error::$MODEL run is '$run_status' ($scored/$total pages scored)"
            exit 1
          fi

      - name: Publish the run to the service store
        env:
          CASEV_SERVICE_DATABASE_URL: ${{ secrets.SERVICE_DATABASE_URL }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
        run: |
          uv run python scripts/publish_run_to_store.py --run-dir "results/$RUN_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-benchmark-${{ steps.ctx.outputs.slug }}-${{ github.run_id }}
          path: src/runner/results/
          retention-days: 90

  # Runs even if some models failed; a missing week just leaves a gap for that model.
  dashboard:
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: src/runner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group store

      - name: Regenerate the README dashboard
        env:
          CASEV_SERVICE_DATABASE_URL: ${{ secrets.SERVICE_DATABASE_URL }}
          CASEV_MODEL_ROSTER: ${{ vars.CASEV_MODEL_ROSTER }}
        run: |
          uv run python scripts/render_benchmark_dashboard.py --table-out "$RUNNER_TEMP/dashboard_table.txt"

      - name: Open/update the dashboard PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: README.md
          branch: weekly-benchmark-dashboard
          commit-message: "chore: refresh weekly benchmark dashboard"
          title: "chore: refresh weekly benchmark dashboard"
          body: >
            Automated README dashboard refresh from the
            [weekly benchmark workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Notify Slack
        working-directory: .
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TABLE_PATH: ${{ runner.temp }}/dashboard_table.txt
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OP: ${{ steps.pr.outputs.pull-request-operation }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          pr_line="No README changes this week."
          if [ "$PR_OP" = "created" ] || [ "$PR_OP" = "updated" ]; then
            pr_line="README update ready to merge: $PR_URL"
          fi
          payload=$(jq -n \
            --rawfile table "$TABLE_PATH" \
            --arg pr "$pr_line" \
            --arg run "$RUN_URL" \
            '{text: ":bar_chart: *Weekly benchmark results*\n```\($table)```\n\($pr)\n<\($run)|workflow run>"}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "$SLACK_WEBHOOK_URL"
