services:
  backend:
    build:
      # Monorepo root, not ./backend -- needed so the build can reach
      # ../packages/location-scorer (a sibling of casework-analyzer/, used
      # for benchmark scoring). See the root .dockerignore for what's kept
      # out of this now-wider context (dataset_local/, .git/, etc).
      context: ..
      dockerfile: casework-analyzer/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
