# Casework Drawing Analyzer configuration.
# Edit this file to change defaults without touching any code.
# Everything here is loaded once at backend startup (see backend/app/core/config.py)
# and can still be overridden per-request from the UI (model, temperature, prompt, etc.).

app:
  name: "Casework Drawing Analyzer"

# LLM models available to the analyze endpoint, all routed through OpenRouter
# (https://openrouter.ai/api/v1). `id` must match a model slug from
# https://openrouter.ai/models (check there for current ids/pricing/vision
# support) and is the value sent to the API and shown in the frontend's model
# dropdown; `provider` selects the adapter in
# backend/app/services/llm_client.py — leave as `openrouter` unless you add a
# new adapter. Add/remove entries freely to compare models across vendors.
models:
  - id: anthropic/claude-sonnet-5
    label: "Claude Sonnet 5 (Anthropic)"
    provider: openrouter
  - id: openai/gpt-5
    label: "GPT-5 (OpenAI)"
    provider: openrouter
  - id: google/gemini-2.5-pro
    label: "Gemini 2.5 Pro (Google)"
    provider: openrouter
  - id: qwen/qwen2.5-vl-72b-instruct
    label: "Qwen2.5-VL 72B (Alibaba)"
    provider: openrouter
  # Routed through the same OpenRouter adapter as claude-sonnet-5 above --
  # fully functional, no new code needed.
  - id: anthropic/claude-sonnet-4.6
    label: "Claude Sonnet 4.6 (Anthropic)"
    provider: openrouter
  - id: anthropic/claude-opus-4.7
    label: "Claude Opus 4.7 (Anthropic)"
    provider: openrouter
  - id: anthropic/claude-opus-4.8
    label: "Claude Opus 4.8 (Anthropic)"
    provider: openrouter
  - id: openai/gpt-5.5
    label: "GPT-5.5 (OpenAI)"
    provider: openrouter
  - id: openai/gpt-5.4
    label: "GPT-5.4 (OpenAI)"
    provider: openrouter
  - id: google/gemini-3.1-pro-preview
    label: "Gemini 3.1 Pro Preview (Google)"
    provider: openrouter
  - id: google/gemini-3-flash-preview
    label: "Gemini 3 Flash Preview (Google)"
    provider: openrouter
  - id: google/gemini-3.5-flash
    label: "Gemini 3.5 Flash (Google)"
    provider: openrouter
  - id: google/gemini-2.5-flash
    label: "Gemini 2.5 Flash (Google)"
    provider: openrouter
  - id: z-ai/glm-5.2
    label: "GLM 5.2 (Z-AI)"
    provider: openrouter

defaults:
  model: anthropic/claude-sonnet-5
  temperature: 0.0
  # Pages with many cabinets/objects need a lot of headroom: each detected
  # object costs ~20-30 tokens (label, 4-number bounding_box), so a busy page
  # can need several thousand. If a result comes back truncated, raise this
  # (or lower it per-request from the UI, or from its own toolbar button)
  # rather than assuming a parse bug.
  max_tokens: 5000
  # System prompt = persona/rules/coordinate format/output schema (sent as a
  # system-role message) -- generic across object types. User prompt = the
  # per-task instruction (sent alongside the image in the user-role message)
  # -- names which label(s) to find and how to recognize them. The model
  # responds with a bare JSON array of {"label", "bounding_box":
  # {"x_min","y_min","x_max","y_max"}}, coordinates normalized 0-1 (see
  # backend/app/models/schemas.py DetectedObject / services/parser.py).
  # It does not count objects; counts are computed downstream from labels.
  system_prompt_file: detector_system.txt
  user_prompt_file: cabinet_user.txt
  # AI-crop mode's Pass 1 (region localization) always uses this fixed
  # prompt to find tagged grid cells, regardless of the system/user prompt
  # above -- it's an internal mechanism, not exposed in the Prompt Editor UI.
  ai_crop_cell_prompt_file: elevations_unfiltered.txt

pdf:
  # DPI used when rendering PDF pages to PNG. Higher = sharper images, larger
  # files, more tokens per request, slower rendering.
  dpi: 150
  max_file_size_mb: 100

analysis:
  # Max number of pages analyzed concurrently against the LLM API.
  concurrency_limit: 4
  # Retry/backoff for transient API errors (rate limits, 5xx, overloaded).
  max_retries: 5
  retry_base_delay_seconds: 1.0

# Canonical object categories used across counts, locations, and export formats.
categories:
  - cabinets
  - elevations
  - countertops
  - elevation_callouts
