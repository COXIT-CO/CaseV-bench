# Alembic configuration, one section per schema that has its own migration history.
#
# There is deliberately **no `[alembic]` section**. That is the name Alembic falls back to when
# `-n` is omitted, and a bare `alembic upgrade head` should not quietly pick a target: the
# schemas here are owned by different roles and migrated with different credentials.
# Without `[alembic]` it fails loudly.
#
#   alembic -n experiments upgrade head      # the shared research store
#

[experiments]
script_location = src/results_store/alembic
# `CASEV_EXPERIMENTS_DDL_DATABASE_URL` — the operator credential (`experiments_ddl`). Distinct
# from the read/write credential developers hold, which Postgres will refuse for any DDL here.
# `src` on the path, so env.py imports `results_store.models` — the same import root the rest
# of the repository uses.
prepend_sys_path = src

# A `[service]` section joins this file when the public benchmark service lands (scope 10),
# pointing at its own script_location, its own env.py and its own alembic_version table.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
