<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CaseV-Bench demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Matches casevbench.com's design tokens: warm near-black ink, a single burnt-orange
    // accent, a forest green for positive/data emphasis, and sharp (unrounded) corners
    // throughout — see each token's --css-custom-property name on the live site.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#19201d",
            muted: "#5c645f",
            line: "#c9ceca",
            soft: "#f3f5f3",
            brand: "#c93913",
            "brand-bright": "#f34b20",
            forest: "#167044",
          },
          fontFamily: {
            sans: ['"DM Sans"', "Arial", "sans-serif"],
            heading: ['"Barlow Semi Condensed"', '"Arial Narrow"', "Arial", "sans-serif"],
            mono: ['"IBM Plex Mono"', "monospace"],
          },
        },
      },
    };
  </script>
</head>
<body class="h-full bg-white font-sans text-ink">
  <button
    id="config-toggle"
    class="fixed top-4 right-4 z-20 border border-line bg-white p-2 hover:bg-soft"
    title="Settings"
    type="button"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-ink" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.532 1.532 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" />
    </svg>
  </button>

  <button
    id="history-toggle"
    class="fixed top-4 left-4 z-20 border border-line bg-white p-2 hover:bg-soft"
    title="History"
    type="button"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-ink" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2a8 8 0 100 16 8 8 0 000-16zM8.75 6.5a.75.75 0 00-1.5 0v4a.75.75 0 00.4.664l3 1.5a.75.75 0 00.67-1.342l-2.57-1.286V6.5z" />
    </svg>
  </button>

  <!-- History drawer -->
  <div id="history-backdrop" class="fixed inset-0 z-10 hidden bg-ink/40"></div>
  <div
    id="history-drawer"
    class="fixed inset-y-0 left-0 z-20 hidden w-80 flex-col border-r border-line bg-white shadow-lg"
  >
    <div class="flex items-center justify-between border-b border-line bg-soft px-4 py-3">
      <h2 class="font-mono text-xs font-medium uppercase tracking-wide text-muted">History</h2>
      <button id="history-close" type="button" class="p-1 text-muted hover:bg-white hover:text-ink" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
        </svg>
      </button>
    </div>
    <div class="border-b border-line p-3">
      <input
        id="history-search"
        type="text"
        placeholder="Search by filename or model…"
        class="w-full border border-line px-2 py-1.5 text-sm focus:border-brand focus:outline-none"
      />
    </div>
    <div id="history-list" class="flex-1 overflow-y-auto"></div>
    <p id="history-empty" class="hidden p-4 text-sm text-muted">No runs yet.</p>
  </div>

  <div
    id="config-panel"
    class="fixed top-14 right-4 z-20 hidden w-72 border border-line bg-white p-4 shadow-lg"
  >
    <h2 class="mb-3 font-mono text-xs font-medium uppercase tracking-wide text-muted">Settings</h2>

    <label class="mb-1 block font-mono text-xs uppercase tracking-wide text-muted">Model</label>
    <select
      id="model-select"
      class="mb-3 w-full border border-line px-2 py-1.5 text-sm focus:border-brand focus:outline-none"
    ></select>
    <input
      id="model-custom"
      type="text"
      placeholder="e.g. openai/gpt-6-astra"
      class="mb-3 hidden w-full border border-line px-2 py-1.5 text-sm focus:border-brand focus:outline-none"
    />

    <button
      id="show-prompt"
      type="button"
      class="w-full border border-line px-2 py-1.5 text-sm text-ink hover:bg-soft"
    >
      Edit prompt
    </button>
  </div>

  <!-- Image lightbox -->
  <div
    id="lightbox"
    class="fixed inset-0 z-30 hidden items-center justify-center bg-ink/90 p-6"
  >
    <button
      id="lightbox-close"
      class="absolute top-4 right-4 border border-white/20 bg-white/10 p-2 text-white hover:bg-white/20"
      type="button"
      title="Close"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
      </svg>
    </button>
    <figure class="flex max-h-full max-w-full flex-col items-center">
      <img id="lightbox-image" class="max-h-[85vh] max-w-[90vw] border border-white/10 object-contain" src="" alt="" />
      <figcaption id="lightbox-caption" class="mt-3 font-mono text-xs text-white/70"></figcaption>
    </figure>
  </div>

  <!-- Prompt popup -->
  <div
    id="prompt-modal"
    class="fixed inset-0 z-30 hidden items-center justify-center bg-ink/70 p-6"
  >
    <div class="flex h-[85vh] w-full max-w-5xl flex-col border border-line bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-line bg-soft px-5 py-3">
        <div>
          <h2 class="font-mono text-xs font-medium uppercase tracking-wide text-muted">Prompt</h2>
          <p id="prompt-modal-status" class="mt-0.5 text-xs text-muted"></p>
        </div>
        <button
          id="prompt-modal-close"
          type="button"
          class="p-1 text-muted hover:bg-white hover:text-ink"
          title="Close"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
          </svg>
        </button>
      </div>
      <textarea
        id="prompt-modal-body"
        spellcheck="false"
        class="min-h-0 flex-1 resize-none overflow-y-auto p-5 font-mono text-sm text-ink focus:outline-none"
      ></textarea>
      <div class="flex items-center justify-between border-t border-line bg-soft px-5 py-3">
        <p class="text-xs text-muted">Editing this changes what's sent to the model for every page.</p>
        <button
          id="prompt-reset"
          type="button"
          class="border border-line bg-white px-3 py-1.5 text-xs text-ink hover:bg-soft"
        >
          Reset to default
        </button>
      </div>
    </div>
  </div>

  <main class="mx-auto max-w-6xl px-6 py-12">
    <div class="mb-6 flex items-center gap-2">
      <span class="inline-block h-3 w-3 bg-brand"></span>
      <span class="font-mono text-xs font-medium uppercase tracking-widest text-brand">CaseVBench</span>
    </div>
    <h1 class="mb-1 font-heading text-4xl font-semibold text-ink">Detection demo</h1>
    <p class="mb-8 text-muted">Upload a drawing sheet PDF and see what the model finds.</p>

    <div class="border-2 border-dashed border-line bg-white p-8 text-center">
      <input id="file-input" type="file" accept="application/pdf" class="hidden" />
      <label for="file-input" class="cursor-pointer font-medium text-brand hover:text-brand-bright hover:underline">Choose a PDF</label>
      <span id="file-name" class="mt-2 block text-sm text-muted">No file selected</span>
    </div>
    <p id="upload-note" class="mt-2 font-mono text-xs text-muted"></p>

    <button
      id="run-button"
      disabled
      class="mt-4 w-full bg-brand px-4 py-3 font-medium text-white hover:bg-brand-bright disabled:cursor-not-allowed disabled:bg-line disabled:text-muted"
      type="button"
    >
      Run detection
    </button>

    <div id="summary-container" class="mt-6 hidden"></div>

    <div id="status" class="mt-6 hidden items-center gap-3 border border-line bg-soft px-4 py-3 font-mono text-sm text-ink">
      <svg id="status-spinner" class="h-4 w-4 flex-shrink-0 animate-spin text-brand" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span id="status-text"></span>
    </div>
    <div id="error" class="mt-6 hidden border border-brand/30 bg-brand/5 p-4 text-sm text-brand"></div>

    <div id="results" class="mt-10 hidden space-y-8"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
