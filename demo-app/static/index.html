<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CaseV-Bench demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-50 text-gray-900">
  <button
    id="config-toggle"
    class="fixed top-4 right-4 z-20 rounded-full border border-gray-200 bg-white p-2 shadow hover:bg-gray-100"
    title="Settings"
    type="button"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.532 1.532 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" />
    </svg>
  </button>

  <div
    id="config-panel"
    class="fixed top-14 right-4 z-20 hidden w-72 rounded-lg border border-gray-200 bg-white p-4 shadow-lg"
  >
    <h2 class="mb-3 text-sm font-semibold text-gray-700">Settings</h2>

    <label class="mb-1 block text-xs font-medium text-gray-500">Model</label>
    <select id="model-select" class="mb-3 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></select>
    <input
      id="model-custom"
      type="text"
      placeholder="e.g. openai/gpt-6-astra"
      class="mb-3 hidden w-full rounded border border-gray-300 px-2 py-1.5 text-sm"
    />

    <button
      id="show-prompt"
      type="button"
      class="w-full rounded border border-gray-300 px-2 py-1.5 text-sm text-gray-700 hover:bg-gray-50"
    >
      Show prompt
    </button>
  </div>

  <!-- Image lightbox -->
  <div
    id="lightbox"
    class="fixed inset-0 z-30 hidden items-center justify-center bg-black/80 p-6"
  >
    <button
      id="lightbox-close"
      class="absolute top-4 right-4 rounded-full bg-white/10 p-2 text-white hover:bg-white/20"
      type="button"
      title="Close"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
      </svg>
    </button>
    <figure class="flex max-h-full max-w-full flex-col items-center">
      <img id="lightbox-image" class="max-h-[85vh] max-w-[90vw] rounded-lg object-contain" src="" alt="" />
      <figcaption id="lightbox-caption" class="mt-3 text-sm text-gray-200"></figcaption>
    </figure>
  </div>

  <!-- Prompt popup -->
  <div
    id="prompt-modal"
    class="fixed inset-0 z-30 hidden items-center justify-center bg-black/50 p-6"
  >
    <div class="flex max-h-[85vh] w-full max-w-2xl flex-col rounded-xl bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-gray-200 px-5 py-3">
        <h2 class="text-sm font-semibold text-gray-700">Prompt</h2>
        <button
          id="prompt-modal-close"
          type="button"
          class="rounded-full p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600"
          title="Close"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
          </svg>
        </button>
      </div>
      <pre
        id="prompt-modal-body"
        class="flex-1 overflow-y-auto whitespace-pre-wrap p-5 font-mono text-xs text-gray-600"
      ></pre>
    </div>
  </div>

  <main class="mx-auto max-w-6xl px-6 py-12">
    <h1 class="mb-1 text-2xl font-semibold">CaseV-Bench demo</h1>
    <p class="mb-6 text-gray-500">Upload a drawing sheet PDF and see what the model finds.</p>

    <div class="rounded-xl border-2 border-dashed border-gray-300 bg-white p-8 text-center">
      <input id="file-input" type="file" accept="application/pdf" class="hidden" />
      <label for="file-input" class="cursor-pointer font-medium text-blue-600 hover:underline">Choose a PDF</label>
      <span id="file-name" class="mt-2 block text-sm text-gray-500">No file selected</span>
    </div>
    <p id="upload-note" class="mt-2 text-xs text-gray-400"></p>

    <div id="summary-container" class="mt-6 hidden"></div>

    <button
      id="run-button"
      disabled
      class="mt-4 w-full rounded-lg bg-blue-600 px-4 py-2.5 font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-gray-300"
      type="button"
    >
      Run detection
    </button>

    <div id="status" class="mt-6 hidden items-center gap-3 rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm text-gray-600">
      <svg id="status-spinner" class="h-4 w-4 flex-shrink-0 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span id="status-text"></span>
    </div>
    <div id="error" class="mt-6 hidden rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700"></div>

    <div id="results" class="mt-10 hidden space-y-8"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
