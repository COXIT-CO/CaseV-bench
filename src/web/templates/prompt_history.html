{% extends "base.html" %}
{% block title %}{{ family }} — {{ title }}{% endblock %}
{% block content %}
<p><a href="/prompts">← Prompts</a></p>
<h2>{{ task }} / {{ family }}</h2>

<form action="/prompts/{{ task }}/{{ family }}" method="post">
  <p>
    <label>Edit — save as a new version:<br />
      <textarea name="text" rows="8" cols="80" required></textarea>
    </label>
  </p>
  <button type="submit">Save new version</button>
</form>

<h3>Version history</h3>
{% for prompt in versions %}
<article>
  <h4>v{{ "%04d"|format(prompt.version) }}</h4>
  <pre style="white-space: pre-wrap;">{{ prompt.text }}</pre>
</article>
{% endfor %}
{% endblock %}
